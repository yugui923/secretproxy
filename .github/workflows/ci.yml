name: CI

on:
  push:
    branches: [main]
  pull_request:

  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-delta:
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    permissions:
      contents: read
    uses: ./.github/workflows/dep-audit-diff.yml

  test:
    name: test (Go ${{ matrix.go }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          test -z "$files" || {
            printf 'gofmt found formatting issues:\n%s\n' "$files"
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -trimpath ./cmd/secret-proxy

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.13"
          cache: true
      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # govulncheck reports only *reachable* vulnerabilities, which is a good
      # signal, but it still fails on any inherited one, so a PR cannot land
      # while the backlog is non-empty. Severity and provenance judgement move
      # to the `Dependency delta (introduced only)` workflow, which compares the
      # merge-base and the PR head and blocks only new CRITICAL/HIGH findings.
      # This step enforces that the analysis actually ran.
      #
      # govulncheck exit codes: 0 = clean, 3 = vulnerabilities found, 1 = the
      # analysis itself failed. Only 1 (or anything else unexpected) is a gate
      # failure here; 3 is a finding set the delta gate judges.
      - name: Check reachable vulnerabilities
        run: |
          set -euo pipefail
          rc=0
          govulncheck ./... || rc=$?
          case "$rc" in
            0|3) exit 0 ;;
            *) echo "govulncheck did not complete (exit $rc)"; exit 1 ;;
          esac

  gate:
    name: CI / gate
    if: ${{ always() }}
    needs: [test, vulncheck, dependency-delta]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require complete dependency delta scan
        if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
        env:
          DELTA_RESULT: ${{ needs.dependency-delta.result }}
        run: test "$DELTA_RESULT" = success
      - name: Require every CI job to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VULNCHECK_RESULT: ${{ needs.vulncheck.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$VULNCHECK_RESULT" = "success"
